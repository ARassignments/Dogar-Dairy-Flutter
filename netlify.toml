[build]
  command = "flutter build web --release --pwa-strategy=offline-first"
  publish = "build/web"

# This redirect ensures that all routes fall back to index.html, allowing
# Flutter's client-side router (e.g., Navigator, go_router) to handle the URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure service worker, bootstrap, and manifest are not cached aggressively
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"dogar-dairy.apk\""