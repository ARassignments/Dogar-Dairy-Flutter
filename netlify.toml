[build]
  # netlify-plugin-flutter already installs the Flutter SDK and puts it on PATH,
  # so the build command just needs to fetch packages and build.
  command = "flutter pub get && flutter build web --release"
  publish = "build/web"

# Ensure client-side routes (e.g. go_router, Navigator 2.0) fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200